<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fall 2026 — MBA Hub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --red:#990000;--red-light:#f5e6e6;--red-dark:#6b0000;
    --navy:#122851;--navy-light:#e8ecf3;--navy-dark:#0a1a36;
    --teal:#00857c;--teal-light:#e0f5f3;--lteal:#50c2bb;
    --mauve:#7A7089;--mauve-light:#edeaf0;
    --wblue:#669DE5;--wblue-light:#e4eefb;--dwblue:#2274E2;
    --bg:#f5f4f1;--surface:#fff;--text:#1c1917;--text2:#5c5856;--text3:#9a9590;
    --border:#ddd9d4;--border2:#ccc7c1;
    --inperson:#eab308;--inperson-light:#fef9c3;--inperson-text:#854d0e;
    --async:#3b82f6;--async-light:#dbeafe;--async-text:#1e40af;
    --danger:#b91c1c;--success:#16a34a;--radius:10px;
    --tag-networking:#00857c;--tag-networking-light:#e0f5f3;
    --tag-social:#669DE5;--tag-social-light:#e4eefb;
    --tag-robins:#990000;--tag-robins-light:#f5e6e6;
    /* muted UR filter accents */
    --f-blue:#3d5687;--f-blue-bd:#c7d0e2;
    --f-red:#9a4b53;--f-red-bd:#e6cdd0;
  }
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .page{max-width:1260px;margin:0 auto;padding:20px 16px;}
  .hero{background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 60%,#1a3566 100%);color:#fff;border-radius:16px;padding:28px 32px 24px;margin-bottom:16px;position:relative;overflow:hidden;}
  .hero::before{content:'';position:absolute;bottom:-30px;left:-30px;width:180px;height:180px;background:radial-gradient(circle,rgba(153,0,0,.25) 0%,transparent 70%);border-radius:50%;}
  .hero::after{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(102,157,229,.15) 0%,transparent 70%);border-radius:50%;}
  .hero h1{font-size:26px;font-weight:700;letter-spacing:-0.8px;margin-bottom:2px;position:relative;}
  .hero .subtitle{font-size:13px;color:#a8b5ca;font-weight:500;position:relative;}
  .hero .legend{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;position:relative;}
  .hero .leg-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;}
  .leg-dot{width:12px;height:12px;border-radius:3px;}

  .tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--surface);border-radius:10px;padding:4px;border:1.5px solid var(--border);width:fit-content;}
  .tab{padding:8px 20px;border-radius:8px;border:none;background:transparent;color:var(--text2);font:600 12px 'DM Sans',sans-serif;cursor:pointer;}
  .tab.active{background:var(--navy);color:#fff;}

  .content{display:grid;grid-template-columns:1fr;gap:16px;}

  /* Panels */
  .panel{background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);overflow:hidden;}
  .panel-header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--border);}
  .panel-header h2{font-size:16px;font-weight:700;}
  .panel-body{padding:12px 16px 16px;}

  /* Month Nav */
  .month-nav{display:flex;gap:3px;flex-wrap:wrap;align-items:center;}
  .month-nav button{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font:600 10px 'DM Sans',sans-serif;cursor:pointer;}
  .month-nav button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .view-toggle{display:flex;gap:2px;margin-left:6px;background:var(--bg);border-radius:6px;padding:2px;}
  .view-toggle button{padding:3px 10px;border-radius:5px;border:none;background:transparent;color:var(--text3);font:600 10px 'DM Sans',sans-serif;cursor:pointer;}
  .view-toggle button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .week-nav{display:flex;gap:4px;align-items:center;}
  .week-nav button{padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font:600 10px 'DM Sans',sans-serif;cursor:pointer;}
  .week-nav .wn-label{font-size:11px;font-weight:600;min-width:120px;text-align:center;}

  /* Calendar grid */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);}
  .cal-dayhead{background:var(--bg);padding:6px 4px;font-size:10px;font-weight:700;text-align:center;color:var(--text2);}
  .cal-cell{background:var(--surface);min-height:80px;padding:4px;position:relative;}
  .cal-cell.other-month{background:#fafaf8;opacity:.5;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--navy);}
  .cal-num{font-size:11px;font-weight:600;margin-bottom:2px;color:var(--text2);}
  .cal-evt{font-size:9px;font-weight:600;padding:2px 4px;border-radius:3px;margin-bottom:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-left:3px solid transparent;}
  .cal-evt.inperson{background:var(--inperson-light);color:var(--inperson-text);border-left-color:var(--inperson);}
  .cal-evt.async{background:var(--async-light);color:var(--async-text);border-left-color:var(--async);}
  .cal-evt.standard{border-left-width:3px;}
  .cal-evt.final-evt{background:#fce7f3;color:#9d174d;border-left-color:#ec4899;}
  .cal-evt.due-evt{background:#fee2e2;color:#b91c1c;border-left-color:#dc2626;}

  /* Week view for calendar */
  .cal-week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);}
  .cal-week-cell{background:var(--surface);min-height:100px;padding:6px;}
  .cal-week-cell.today{box-shadow:inset 0 0 0 2px var(--navy);}
  .cal-week-dayhead{font-size:10px;font-weight:700;color:var(--text3);margin-bottom:2px;}
  .cal-week-date{font-size:14px;font-weight:700;margin-bottom:4px;}

  /* Due dates */
  .wdi{padding:8px 0;border-bottom:1px solid var(--border);}
  .wdi:last-child{border-bottom:none;}
  .wdi-row{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .wdi-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--border2);background:var(--surface);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
  .wdi-check.checked{background:var(--success);border-color:var(--success);}
  .wdi-body{flex:1;min-width:0;}
  .wdi-title{font-size:12px;font-weight:600;}
  .wdi-title.struck{text-decoration:line-through;color:var(--text3);}
  .wdi-meta{font-size:10px;color:var(--text2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .wdi-class-tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;}
  .wdi-type{font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;}
  .wdi-type.reading{background:#dbeafe;color:#1e40af;}
  .wdi-type.presentation{background:#fce7f3;color:#9d174d;}
  .wdi-type.quiz{background:#fee2e2;color:#b91c1c;}
  .wdi-type.deliverable{background:#e0f5f3;color:#065f56;}
  .wdi-type.paper{background:#fef3c7;color:#92400e;}
  .wdi-type.discussion{background:#edeaf0;color:#5b4f6e;}
  .wdi-type.other{background:#e8ecf3;color:#122851;}
  .wdi-chevron{font-size:10px;color:var(--text3);transition:transform .2s;flex-shrink:0;}
  .wdi-chevron.open{transform:rotate(90deg);}
  .wdi-detail{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .wdi-detail.open{max-height:300px;}
  .wdi-detail-row{display:flex;gap:8px;font-size:11px;padding:4px 0 0 26px;color:var(--text2);}
  .wdi-detail-label{font-weight:700;color:var(--text);min-width:50px;}
  .wdi-edit{width:auto;padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font:600 10px 'DM Sans',sans-serif;color:var(--text2);margin-left:26px;margin-top:4px;}

  .dc-filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
  .dc-filter{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font:600 10px 'DM Sans',sans-serif;cursor:pointer;}
  .dc-filter.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .dc-filter.fclass{color:var(--f-blue);border-color:var(--f-blue-bd);}
  .dc-filter.fclass.active{background:var(--f-blue);color:#fff;border-color:var(--f-blue);}
  .dc-filter.ftype{color:var(--f-red);border-color:var(--f-red-bd);}
  .dc-filter.ftype.active{background:var(--f-red);color:#fff;border-color:var(--f-red);}

  .add-btn{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1.5px dashed var(--border2);background:transparent;color:var(--text2);font:700 11px 'DM Sans',sans-serif;cursor:pointer;}
  .add-btn:hover{border-color:var(--navy);color:var(--navy);}
  .empty{text-align:center;padding:24px 0;color:var(--text3);font-size:12px;}

  /* Social */
  .soc-legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .soc-legend-item{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;cursor:pointer;padding:3px 8px;border-radius:5px;border:1px solid transparent;transition:all .15s;}
  .soc-legend-item.active{border-color:currentColor;opacity:1;}
  .soc-legend-item.dimmed{opacity:.4;}
  .soc-legend-dot{width:8px;height:8px;border-radius:2px;}
  .soc-evt{border-bottom:1px solid var(--border);padding:6px 0;}
  .soc-evt:last-child{border-bottom:none;}
  .soc-evt-row{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .soc-icon{font-size:16px;flex-shrink:0;}
  .soc-body{flex:1;min-width:0;}
  .soc-title{font-size:12px;font-weight:600;}
  .soc-meta{font-size:10px;color:var(--text2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .soc-tag{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;}
  .soc-detail{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .soc-detail.open{max-height:600px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;display:none;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:14px;padding:22px;width:92%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal h3{font-size:16px;font-weight:700;margin-bottom:14px;}
  .modal label{display:block;font-size:10px;font-weight:600;color:var(--text2);margin:6px 0 3px;}
  .modal input,.modal select,.modal textarea{width:100%;padding:8px 10px;border-radius:7px;border:1.5px solid var(--border);font:400 13px 'DM Sans',sans-serif;outline:none;margin-bottom:4px;}
  .modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--navy);}
  .m-actions{display:flex;gap:6px;margin-top:16px;}
  .m-actions .del{padding:9px 14px;border-radius:7px;border:none;background:#fee2e2;color:var(--danger);font:700 12px 'DM Sans',sans-serif;cursor:pointer;}
  .m-actions .cancel{padding:9px 14px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font:600 12px 'DM Sans',sans-serif;cursor:pointer;}
  .m-actions .save{padding:9px 18px;border-radius:7px;border:none;background:var(--navy);color:#fff;font:700 12px 'DM Sans',sans-serif;cursor:pointer;}
  .tag-picker{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;}
  .tag-picker button{padding:4px 10px;border-radius:5px;font:600 10px 'DM Sans',sans-serif;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);}
  .tag-picker button.sel{border-color:currentColor;}

  .month-picker-wrap{position:relative;display:inline-block;}
  .mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);}
  .mini-cal-cell{background:var(--surface);min-height:54px;padding:3px;position:relative;cursor:pointer;}
  .mini-cal-cell:hover{background:var(--bg);}
  .mini-cal-cell.other-month{background:#fafaf8;opacity:.45;}
  .mini-cal-cell.today{box-shadow:inset 0 0 0 2px var(--navy);}
  .mini-cal-num{font-size:10px;font-weight:600;color:var(--text2);margin-bottom:1px;}
  .mini-cal-dots{display:flex;flex-direction:column;gap:1px;}
  .mini-cal-dot{font-size:7px;font-weight:700;padding:1px 3px;border-radius:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.3;}
  .mini-cal-more{font-size:7px;color:var(--text3);font-weight:700;padding:0 3px;}

  /* Popover card */
  .popover-backdrop{position:fixed;inset:0;z-index:90;}
  .popover{position:fixed;z-index:95;background:var(--surface);border-radius:12px;border:1.5px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.18);padding:16px;width:300px;max-height:70vh;overflow-y:auto;}
  .popover-title{font-size:14px;font-weight:700;margin-bottom:6px;}
  .popover-meta{font-size:10px;color:var(--text2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
  .popover-section{margin-bottom:6px;}
  .popover-label{font-size:10px;font-weight:700;color:var(--text);margin-bottom:2px;}
  .popover-text{font-size:11px;color:var(--text2);line-height:1.6;}
  .popover-close{position:absolute;top:10px;right:12px;background:none;border:none;font-size:16px;cursor:pointer;color:var(--text3);padding:2px 6px;border-radius:4px;}
  .popover-close:hover{background:var(--bg);color:var(--text);}
  .month-picker-btn{padding:0;border:none;background:none;font:700 16px 'DM Sans',sans-serif;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:4px;}
  .month-picker-btn:hover{color:var(--navy);}
  .month-picker-btn .caret{font-size:10px;transition:transform .2s;}
  .month-picker-btn .caret.open{transform:rotate(180deg);}
  .month-dropdown{position:absolute;top:100%;left:0;margin-top:4px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;z-index:50;min-width:220px;}
  .month-dropdown button{padding:6px 10px;border-radius:6px;border:none;background:transparent;color:var(--text2);font:600 11px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;}
  .month-dropdown button:hover{background:var(--bg);}
  .month-dropdown button.active{background:var(--navy);color:#fff;}
  .cal-arrow{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text2);}
  .cal-arrow:hover{background:var(--bg);color:var(--text);}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 22px;border-radius:10px;font:600 12px 'DM Sans',sans-serif;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;}
  .toast.show{display:block;}
  @media(max-width:700px){.page{padding:12px 8px;}.hero{padding:20px 16px 18px;}.hero h1{font-size:22px;}}
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <h1>MBA Hub — 2026–2027</h1>
    <div class="subtitle">Aug '26 – Aug '27 · University of Richmond · Robins School of Business</div>
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:var(--inperson)"></div> In-Person</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--async)"></div> Async</div>
      <div class="leg-item"><div class="leg-dot" style="background:#ec4899"></div> Final</div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="content">
    <div class="panel" id="calPanel"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="panel" id="duePanel"></div>
      <div class="panel" id="socPanel"></div>
    </div>
  </div>
</div>

<div class="overlay" id="dueModal">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="dueModalTitle">Add Assignment</h3>
    <label>Title</label><input id="dmTitle" placeholder="e.g. Case Study Analysis"/>
    <label>Class</label><select id="dmClass"></select>
    <label>Due Date</label><input id="dmDate" type="date"/>
    <label>Type</label>
    <select id="dmType"><option value="deliverable">Deliverable</option><option value="paper">Paper</option><option value="reading">Reading</option><option value="presentation">Presentation</option><option value="quiz">Quiz</option><option value="discussion">Discussion</option><option value="other">Other</option></select>
    <label>Weight / Points (optional)</label><input id="dmWeight" placeholder="e.g. 20% or 50 pts"/>
    <label>Notes (optional)</label><textarea id="dmNotes" rows="2" placeholder="e.g. Submit via Canvas"></textarea>
    <div class="m-actions">
      <button class="del" id="dmDel" style="display:none" onclick="deleteDue()">Delete</button>
      <div style="flex:1"></div>
      <button class="cancel" onclick="closeDueModal()">Cancel</button>
      <button class="save" onclick="saveDue()">Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="socModal">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="socModalTitle">Add Event</h3>
    <label>Title</label><input id="smTitle" placeholder="e.g. Networking Mixer"/>
    <label>Date</label><input id="smDate" type="date"/>
    <label>Start Time</label><input id="smTime" type="time"/>
    <label>End Time</label><input id="smEndTime" type="time"/>
    <label>Location</label><input id="smLoc" placeholder="e.g. Ukrop Auditorium"/>
    <label>Tags</label>
    <div class="tag-picker" id="smTags"></div>
    <label>Notes (optional)</label><textarea id="smNotes" rows="2" placeholder="e.g. RSVP by Friday"></textarea>
    <div class="m-actions">
      <button class="del" id="smDel" style="display:none" onclick="deleteSocial()">Delete</button>
      <div style="flex:1"></div>
      <button class="cancel" onclick="closeSocModal()">Cancel</button>
      <button class="save" onclick="saveSocial()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="popoverContainer"></div>

// Type buckets for the Readings / Deliverables filter
const READING_TYPES=["reading","discussion","other"];
const DELIVERABLE_TYPES=["deliverable","paper","presentation","quiz"];
function matchesDueType(a){
  const t=a.type||"other";
  if(dueTypeFilter==="readings")return READING_TYPES.includes(t);
  if(dueTypeFilter==="deliverables")return DELIVERABLE_TYPES.includes(t);
  return true; // "all"
}

function uid(){return Math.random().toString(36).slice(2,9);}
function pd(s){const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function ds(d){return d.toISOString().split("T")[0];}
function getMonday(d){const dt=new Date(d);const day=dt.getDay();const diff=day===0?-6:1-day;dt.setDate(dt.getDate()+diff);return ds(dt);}
function fds(s){const d=pd(s);return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});}
function fdl(s){const d=pd(s);return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});}
function ft(t){if(!t)return"";const[h,m]=t.split(":");const hr=+h;const ampm=hr>=12?"PM":"AM";const h12=hr%12||12;return m==="00"?`${h12} ${ampm}`:`${h12}:${m} ${ampm}`;}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function escNl(s){return esc(s).replace(/\n/g,"<br>");}
function daysUntil(s){const d=pd(s);const now=new Date();now.setHours(0,0,0,0);return Math.ceil((d-now)/86400000);}
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200);}

function visClasses(){
  if(calTab==="all")return Object.keys(CLASSES);
  return Object.keys(CLASSES).filter(k=>CLASSES[k].cohort===calTab);
}
function visDueClasses(){
  if(dueTab==="all")return Object.keys(CLASSES);
  return Object.keys(CLASSES).filter(k=>CLASSES[k].cohort===dueTab);
}

// ===== Shared data (data/data.json) + Firebase (user events) + localStorage (personal) =====
// Base data comes from data/data.json (assignments + seed social events).
// User-added social events sync to Firebase so everyone sees them.
// Personal data (check-offs, edits, hidden items) stays in localStorage.
const PKEY="mba-hub-personal-v2";
const DATA_URL="data/data.json";
let baseAsg=[],baseSoc=[],dataStamp="";
let firebaseSoc=[];  // events from Firebase (shared across all users)
let personal={done:{},hiddenAsg:[],editAsg:{},userAsg:[],hiddenSoc:[],editSoc:{}};

function loadPersonal(){try{const r=localStorage.getItem(PKEY);if(r)personal=Object.assign(personal,JSON.parse(r));}catch{}}
function persist(){try{localStorage.setItem(PKEY,JSON.stringify(personal));}catch{}}

function rebuild(){
  assignments=baseAsg.filter(a=>!personal.hiddenAsg.includes(a.id))
    .map(a=>({...a,...(personal.editAsg[a.id]||{}),base:true,done:!!personal.done[a.id]}))
    .concat(personal.userAsg.map(a=>({...a,base:false,done:!!a.done})));
  socialEvents=baseSoc.filter(e=>!personal.hiddenSoc.includes(e.id))
    .map(e=>({...e,...(personal.editSoc[e.id]||{}),base:true}))
    .concat(firebaseSoc.map(e=>({...e,base:false,shared:true})));
}

async function loadData(){
  loadPersonal();
  // Migrate old userSoc from localStorage → Firebase (one-time)
  try{
    const old=localStorage.getItem("mba-hub-personal-v1");
    if(old){const p=JSON.parse(old);if(p.userSoc&&p.userSoc.length){p.userSoc.forEach(e=>{fbSocRef.child(e.id).set(e);});delete p.userSoc;localStorage.setItem("mba-hub-personal-v1",JSON.stringify(p));}}
  }catch{}
  try{
    const res=await fetch(DATA_URL,{cache:"no-store"});
    if(res.ok){const j=await res.json();baseAsg=j.assignments||[];baseSoc=j.social||j.socialEvents||[];dataStamp=j.updated||"";}
  }catch{}
  if(!baseAsg.length)baseAsg=DEFAULT_ASSIGNMENTS.map(a=>({...a}));
  if(!baseSoc.length)baseSoc=DEFAULT_SOCIAL.map(e=>({...e}));
  rebuild();
  const now=new Date();
  calWeekStart=getMonday(now);dueWeekStart=getMonday(now);socWeekStart=getMonday(now);
  render();
  // Listen to Firebase for shared social events — live updates
  fbSocRef.on("value",snap=>{
    const val=snap.val();
    firebaseSoc=val?Object.values(val):[];
    rebuild();render();
  });
}

function getEventsForDate(dateStr){
  const vc=visClasses();const evts=[];
  vc.forEach(cls=>{(SCHEDULE[cls]||[]).forEach(([d,type])=>{if(d===dateStr)evts.push({cls,type,label:CLASSES[cls].label,color:CLASSES[cls].color,light:CLASSES[cls].light,room:CLASSES[cls].room});});});

  return evts;
}

function evtHtml(e){
  const rm=e.room&&(e.type==="inperson"||e.type==="standard")?" · Rm "+e.room:"";
  if(e.type==="final")return`<div class="cal-evt final-evt">🎓 ${esc(e.label)}</div>`;
  if(e.type==="inperson")return`<div class="cal-evt inperson">${esc(e.label)}${rm}</div>`;
  if(e.type==="async")return`<div class="cal-evt async">${esc(e.label)}</div>`;
  return`<div class="cal-evt standard" style="background:${e.light};color:${e.color};border-left-color:${e.color}">${esc(e.label)}${rm}</div>`;
}

function syncCalMonth(){const mid=pd(calWeekStart);mid.setDate(mid.getDate()+3);const m=mid.getMonth();const idx=MONTHS.findIndex(x=>x.month===m&&x.year===mid.getFullYear());if(idx>=0)activeMonth=idx;}
function prevCalWeek(){const d=pd(calWeekStart);d.setDate(d.getDate()-7);calWeekStart=ds(d);syncCalMonth();render();}
function nextCalWeek(){const d=pd(calWeekStart);d.setDate(d.getDate()+7);calWeekStart=ds(d);syncCalMonth();render();}

// ==================== RENDER ====================
function render(){renderTabs();renderCal();renderDue();renderSoc();}

function renderTabs(){
  const tabs=[{key:"all",label:"All"},{key:"1st",label:"1st Year"},{key:"2nd",label:"2nd Year"}];
  document.getElementById("tabs").innerHTML=tabs.map(t=>`<button class="tab${calTab===t.key?" active":""}" onclick="calTab='${t.key}';dueTab='${t.key}';render()">${t.label}</button>`).join("");
}

// ---- CALENDAR ----
let monthPickerOpen=false;
function toggleMonthPicker(){monthPickerOpen=!monthPickerOpen;render();}
function selectMonth(i){activeMonth=i;monthPickerOpen=false;if(calView==='week')calWeekStart=getMonday(new Date(MONTHS[i].year,MONTHS[i].month,1));render();}
function prevMonth(){if(activeMonth>0){activeMonth--;if(calView==='week')calWeekStart=getMonday(new Date(MONTHS[activeMonth].year,MONTHS[activeMonth].month,1));render();}}
function nextMonth(){if(activeMonth<MONTHS.length-1){activeMonth++;if(calView==='week')calWeekStart=getMonday(new Date(MONTHS[activeMonth].year,MONTHS[activeMonth].month,1));render();}}

function renderCal(){
  const mo=MONTHS[activeMonth];
  let h=`<div class="panel-header"><h2>📅 Class Schedule</h2><div style="display:flex;align-items:center;gap:6px;">`;
  h+=`<div class="view-toggle"><button class="${calView==="month"?"active":""}" onclick="calView='month';render()">Month</button><button class="${calView==="week"?"active":""}" onclick="calView='week';calWeekStart=getMonday(new Date(MONTHS[activeMonth].year,MONTHS[activeMonth].month,1));render()">Week</button></div>`;
  h+=`</div></div><div class="panel-body">`;
  // Arrow nav + month picker
  h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">`;
  h+=`<button class="cal-arrow" onclick="prevMonth()">◀</button>`;
  h+=`<div class="month-picker-wrap"><button class="month-picker-btn" onclick="toggleMonthPicker()">${MN[mo.month]} ${mo.year} <span class="caret${monthPickerOpen?" open":""}">▼</span></button>`;
  if(monthPickerOpen){
    h+=`<div class="month-dropdown">`;
    h+=MONTHS.map((m,i)=>`<button class="${activeMonth===i?"active":""}" onclick="event.stopPropagation();selectMonth(${i})">${m.label.replace("'","'")}</button>`).join("");
    h+=`</div>`;
  }
  h+=`</div>`;
  h+=`<button class="cal-arrow" onclick="nextMonth()">▶</button>`;
  h+=`</div>`;

  if(calView==="month")h+=renderCalMonth(mo);
  else h+=renderCalWeek();
  h+=`</div>`;
  document.getElementById("calPanel").innerHTML=h;
}

// Close month picker when clicking outside
document.addEventListener("click",e=>{if(monthPickerOpen&&!e.target.closest(".month-picker-wrap")){monthPickerOpen=false;render();}});

function renderCalMonth(mo){
  const firstDay=new Date(mo.year,mo.month,1);const startDow=firstDay.getDay();const dim=new Date(mo.year,mo.month+1,0).getDate();const today=ds(new Date());
  let h=`<div class="cal-grid">`;
  DN.forEach(d=>h+=`<div class="cal-dayhead">${d}</div>`);
  const prevDays=new Date(mo.year,mo.month,0).getDate();
  for(let i=startDow-1;i>=0;i--){const day=prevDays-i;const pm=mo.month===0?11:mo.month-1;const py=mo.month===0?mo.year-1:mo.year;const s=`${py}-${String(pm+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;const e=getEventsForDate(s);h+=`<div class="cal-cell other-month"><div class="cal-num">${day}</div>${e.map(x=>evtHtml(x)).join("")}</div>`;}

function getDueEventsForDate(dateStr,filtered){
  return filtered.filter(a=>a.date===dateStr);
}

function renderMiniMonthCal(mo,items,panel){
  const firstDay=new Date(mo.year,mo.month,1);const startDow=firstDay.getDay();const dim=new Date(mo.year,mo.month+1,0).getDate();const today=ds(new Date());
  let h=`<div class="mini-cal-grid">`;
  DN.forEach(d=>h+=`<div class="cal-dayhead">${d}</div>`);
  const prevDays=new Date(mo.year,mo.month,0).getDate();
  for(let i=startDow-1;i>=0;i--){const day=prevDays-i;
    h+=`<div class="mini-cal-cell other-month"><div class="mini-cal-num">${day}</div></div>`;}
  for(let d=1;d<=dim;d++){
    const s=`${mo.year}-${String(mo.month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const isT=s===today;
    const dayItems=panel==="due"?getDueEventsForDate(s,items):getSocEventsForDate(s,items);
    h+=`<div class="mini-cal-cell${isT?" today":""}"><div class="mini-cal-num">${d}</div><div class="mini-cal-dots">`;
    const maxShow=2;
    dayItems.slice(0,maxShow).forEach((item,idx)=>{
      if(panel==="due"){
        const c=CLASSES[item.cls]||{color:"#888",light:"#eee"};
        h+=`<div class="mini-cal-dot" style="background:${c.light};color:${c.color};cursor:pointer" onclick="event.stopPropagation();openCardPopover('${panel}','${item.id}',this)">${esc(item.title.substring(0,18))}</div>`;
      } else {
        const firstTag=(item.tags||[])[0];const tg=firstTag?TAGS[firstTag]:null;
        const bg=tg?tg.light:"var(--bg)";const col=tg?tg.color:"var(--text2)";
        h+=`<div class="mini-cal-dot" style="background:${bg};color:${col};cursor:pointer" onclick="event.stopPropagation();openCardPopover('${panel}','${item.id}',this)">${esc(item.title.substring(0,18))}</div>`;
      }
    });
    if(dayItems.length>maxShow){
      const ids=dayItems.map(x=>x.id).join(",");
      h+=`<div class="mini-cal-more" style="cursor:pointer" onclick="event.stopPropagation();openDayPopover('${panel}','${s}',this)">+${dayItems.length-maxShow} more</div>`;
    }
    h+=`</div></div>`;
  }
  const total=startDow+dim;const rem=(7-total%7)%7;
  for(let d=1;d<=rem;d++){h+=`<div class="mini-cal-cell other-month"><div class="mini-cal-num">${d}</div></div>`;}
  h+=`</div>`;
  return h;
}

function closePopover(){document.getElementById("popoverContainer").innerHTML="";}

function buildDuePopover(a){
  const c=CLASSES[a.cls]||{label:"?",color:"#888",light:"#eee"};
  const aType=a.type||"other";const typeLabel=aType.charAt(0).toUpperCase()+aType.slice(1);
  const timeStr=a.time?ft(a.time):"";
  const du=daysUntil(a.date);
  const urgency=a.done?"":du<0?`<span style="color:var(--danger);font-weight:700">${Math.abs(du)}d overdue</span>`:du===0?`<span style="color:var(--danger);font-weight:700">Due today</span>`:`<span>${du}d left</span>`;
  let h=`<button class="popover-close" onclick="closePopover()">✕</button>`;
  h+=`<div class="popover-title">${esc(a.title)}</div>`;
  h+=`<div class="popover-meta"><span class="wdi-class-tag" style="background:${c.light};color:${c.color}">${c.label}</span><span class="wdi-type ${aType}">${typeLabel}</span>${urgency}</div>`;
  h+=`<div class="popover-section"><div class="popover-label">Due</div><div class="popover-text">${fdl(a.date)}${timeStr?" · "+timeStr:""}</div></div>`;
  if(a.weight)h+=`<div class="popover-section"><div class="popover-label">Weight</div><div class="popover-text">${esc(a.weight)}</div></div>`;
  if(a.notes)h+=`<div class="popover-section"><div class="popover-label">Notes</div><div class="popover-text">${escNl(a.notes)}</div></div>`;
  return h;
}

function buildSocPopover(ev){
  const ts=ev.time?ft(ev.time):"";const te=ev.endTime?ft(ev.endTime):"";const timeStr=ts?(te?`${ts} – ${te}`:ts):"";
  const tagHtml=(ev.tags||[]).map(t=>{const tg=TAGS[t];return tg?`<span class="soc-tag" style="background:${tg.light};color:${tg.color}">${tg.label}</span>`:""}).join(" ");
  let h=`<button class="popover-close" onclick="closePopover()">✕</button>`;
  h+=`<div class="popover-title">🕷️ ${esc(ev.title)}</div>`;
  h+=`<div class="popover-meta">${tagHtml}</div>`;
  h+=`<div class="popover-section"><div class="popover-label">When</div><div class="popover-text">${fdl(ev.date)}${timeStr?" · "+timeStr:""}</div></div>`;
  if(ev.location)h+=`<div class="popover-section"><div class="popover-label">Where</div><div class="popover-text">${esc(ev.location)}</div></div>`;

function positionPopover(html,rect){
  const ctr=document.getElementById("popoverContainer");
  // Position near the clicked element
  let top=rect.bottom+6;let left=rect.left;
  // Keep within viewport
  const vw=window.innerWidth;const vh=window.innerHeight;
  if(left+310>vw)left=vw-316;
  if(left<8)left=8;
  if(top+300>vh)top=rect.top-306;
  if(top<8)top=8;
  ctr.innerHTML=`<div class="popover-backdrop" onclick="closePopover()"></div><div class="popover" style="top:${top}px;left:${left}px;">${html}</div>`;
}

function dueItemHtml(a){
  const c=CLASSES[a.cls]||{label:"?",color:"#888",light:"#eee"};

  const urgency=a.done?"":du<0?`<span style="color:var(--danger);font-weight:700">${Math.abs(du)}d overdue</span>`:du===0?`<span style="color:var(--danger);font-weight:700">Due today</span>`:`<span>${du}d left</span>`;

function toggleExpand(id){expandedId=expandedId===id?null:id;render();}
function toggleDue(id){
  const a=assignments.find(x=>x.id===id);if(!a)return;
  if(a.base){if(personal.done[id])delete personal.done[id];else personal.done[id]=true;}
  else personal.userAsg=personal.userAsg.map(x=>x.id===id?{...x,done:!x.done}:x);
  persist();rebuild();render();
}
function openDueModal(mode,a){
  document.getElementById("dueModalTitle").textContent=mode==="add"?"Add Assignment":"Edit Assignment";
  const sel=document.getElementById("dmClass");sel.innerHTML=Object.entries(CLASSES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join("");
  if(mode==="edit"&&a){editDueId=a.id;document.getElementById("dmTitle").value=a.title;sel.value=a.cls;document.getElementById("dmDate").value=a.date;document.getElementById("dmType").value=a.type||"other";document.getElementById("dmWeight").value=a.weight||"";document.getElementById("dmNotes").value=a.notes||"";document.getElementById("dmDel").style.display="block";}
  else{editDueId=null;document.getElementById("dmTitle").value="";document.getElementById("dmDate").value="";document.getElementById("dmType").value="deliverable";document.getElementById("dmWeight").value="";document.getElementById("dmNotes").value="";document.getElementById("dmDel").style.display="none";}
  document.getElementById("dueModal").classList.add("open");
}
function closeDueModal(){document.getElementById("dueModal").classList.remove("open");}
function saveDue(){
  const title=document.getElementById("dmTitle").value.trim();const cls=document.getElementById("dmClass").value;const date=document.getElementById("dmDate").value;const type=document.getElementById("dmType").value;const weight=document.getElementById("dmWeight").value.trim();const notes=document.getElementById("dmNotes").value.trim();
  if(!title||!date){toast("Title and date required");return;}
  if(editDueId){
    const a=assignments.find(x=>x.id===editDueId);
    if(a&&a.base)personal.editAsg[editDueId]={...(personal.editAsg[editDueId]||{}),title,cls,date,type,weight,notes};
    else personal.userAsg=personal.userAsg.map(x=>x.id===editDueId?{...x,title,cls,date,type,weight,notes}:x);
  } else {
    personal.userAsg.push({id:uid(),title,cls,date,type,weight,notes,done:false});
  }
  persist();rebuild();closeDueModal();render();
}
function deleteDue(){
  const a=assignments.find(x=>x.id===editDueId);
  if(a&&a.base){if(!personal.hiddenAsg.includes(editDueId))personal.hiddenAsg.push(editDueId);delete personal.editAsg[editDueId];delete personal.done[editDueId];toast("Hidden on this device");}
  else personal.userAsg=personal.userAsg.filter(x=>x.id!==editDueId);
  persist();rebuild();closeDueModal();render();
}

function socItemHtml(ev,showDate){

  const dateTag=showDate?`<span class="wdi-class-tag" style="background:var(--navy-light);color:var(--navy)">${fds(ev.date)}</span>`:"";
  const evJson=JSON.stringify(ev).replace(/"/g,'&quot;');
  return`<div class="soc-evt"><div class="soc-evt-row" onclick="toggleSocExpand('${ev.id}')"><div class="soc-icon">🕷️</div><div class="soc-body"><div class="soc-title">${esc(ev.title)}</div><div class="soc-meta">${dateTag}${timeStr?`<span>🕐 ${timeStr}</span>`:""}${ev.location?`<span>📍 ${esc(ev.location).split(",")[0]}</span>`:""}${tagHtml}</div></div><span class="wdi-chevron${isE?" open":""}">▶</span></div><div class="soc-detail${isE?" open":""}"><div class="wdi-detail-row"><span class="wdi-detail-label">When</span><span>${fdl(ev.date)}${timeStr?" · "+timeStr:""}</span></div>${ev.location?`<div class="wdi-detail-row"><span class="wdi-detail-label">Where</span><span>${esc(ev.location)}</span></div>`:""}${ev.notes?`<div class="wdi-detail-row" style="flex-direction:column;gap:2px"><span class="wdi-detail-label">Details</span><span style="font-size:10px;line-height:1.6">${escNl(ev.notes)}</span></div>`:""}<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="wdi-edit" style="width:auto" onclick="event.stopPropagation();openSocModal('edit',${evJson})">✎ Edit</button><button class="wdi-edit" style="width:auto" onclick="event.stopPropagation();addToGoogleCal(${evJson})">📅 Google Cal</button><button class="wdi-edit" style="width:auto" onclick="event.stopPropagation();downloadICS(${evJson})">🗓️ iCal</button></div></div></div>`;
}

function toggleSocExpand(id){expandedSocId=expandedSocId===id?null:id;render();}
function toggleTagFilter(t){if(socTagFilter.includes(t))socTagFilter=socTagFilter.filter(x=>x!==t);else socTagFilter.push(t);render();}

// Google Cal / iCal export
function toCalDate(date,time){const d=date.replace(/-/g,"");if(!time)return d;return d+"T"+time.replace(/:/g,"")+"00";}
function addToGoogleCal(ev){
  const start=toCalDate(ev.date,ev.time);let end;
  if(ev.endTime)end=toCalDate(ev.date,ev.endTime);
  else if(ev.time){const[h,m]=ev.time.split(":").map(Number);end=toCalDate(ev.date,String(h+1).padStart(2,"0")+":"+String(m).padStart(2,"0"));}
  const isAllDay=!ev.time;let dates;
  if(isAllDay){const next=new Date(pd(ev.date));next.setDate(next.getDate()+1);dates=`${start}/${ds(next).replace(/-/g,"")}`;}else{dates=`${start}/${end}`;}
  window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ev.title)}&dates=${dates}&location=${encodeURIComponent(ev.location||"")}&details=${encodeURIComponent((ev.notes||"").replace(/\n/g,"\n"))}`,"_blank");
}
function downloadICS(ev){
  const nl="\r\n";let ics="BEGIN:VCALENDAR"+nl+"VERSION:2.0"+nl+"PRODID:-//MBA Hub//EN"+nl+"BEGIN:VEVENT"+nl;
  if(!ev.time){const d=ev.date.replace(/-/g,"");const next=new Date(pd(ev.date));next.setDate(next.getDate()+1);ics+="DTSTART;VALUE=DATE:"+d+nl+"DTEND;VALUE=DATE:"+ds(next).replace(/-/g,"")+nl;}
  else{ics+="DTSTART:"+toCalDate(ev.date,ev.time)+nl;let end;if(ev.endTime)end=toCalDate(ev.date,ev.endTime);else{const[h,m]=ev.time.split(":").map(Number);end=toCalDate(ev.date,String(h+1).padStart(2,"0")+":"+String(m).padStart(2,"0"));}ics+="DTEND:"+end+nl;}
  ics+="SUMMARY:"+ev.title.replace(/,/g,"\\,")+nl;
  if(ev.location)ics+="LOCATION:"+ev.location.replace(/,/g,"\\,")+nl;
  if(ev.notes)ics+="DESCRIPTION:"+ev.notes.replace(/\n/g,"\\n").replace(/,/g,"\\,")+nl;
  ics+="END:VEVENT"+nl+"END:VCALENDAR";
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=ev.title.replace(/[^a-zA-Z0-9]/g,"_").substring(0,40)+".ics";a.click();
}

// Social modal
let smSelTags=[];
function openSocModal(mode,ev){
  document.getElementById("socModalTitle").textContent=mode==="add"?"Add Event":"Edit Event";
  if(mode==="edit"&&ev){editSocId=ev.id;document.getElementById("smTitle").value=ev.title;document.getElementById("smDate").value=ev.date;document.getElementById("smTime").value=ev.time||"";document.getElementById("smEndTime").value=ev.endTime||"";document.getElementById("smLoc").value=ev.location||"";document.getElementById("smNotes").value=ev.notes||"";smSelTags=[...(ev.tags||[])];document.getElementById("smDel").style.display="block";}
  else{editSocId=null;document.getElementById("smTitle").value="";document.getElementById("smDate").value="";document.getElementById("smTime").value="";document.getElementById("smEndTime").value="";document.getElementById("smLoc").value="";document.getElementById("smNotes").value="";smSelTags=[];document.getElementById("smDel").style.display="none";}
  renderSmTags();document.getElementById("socModal").classList.add("open");
}
function closeSocModal(){document.getElementById("socModal").classList.remove("open");}
function renderSmTags(){document.getElementById("smTags").innerHTML=Object.entries(TAGS).map(([k,t])=>`<button class="${smSelTags.includes(k)?"sel":""}" style="${smSelTags.includes(k)?`background:${t.light};color:${t.color};border-color:${t.color}`:""}" onclick="toggleSmTag('${k}')">${t.label}</button>`).join("");}
function toggleSmTag(t){if(smSelTags.includes(t))smSelTags=smSelTags.filter(x=>x!==t);else smSelTags.push(t);renderSmTags();}
function saveSocial(){
  const title=document.getElementById("smTitle").value.trim();const date=document.getElementById("smDate").value;const time=document.getElementById("smTime").value;const endTime=document.getElementById("smEndTime").value;const location=document.getElementById("smLoc").value.trim();const notes=document.getElementById("smNotes").value.trim();
  if(!title||!date){toast("Title and date required");return;}
  if(editSocId){
    const e=socialEvents.find(x=>x.id===editSocId);
    if(e&&e.base){personal.editSoc[editSocId]={...(personal.editSoc[editSocId]||{}),title,date,time,endTime,location,tags:[...smSelTags],notes};persist();}
    else{const updated={id:editSocId,title,date,time,endTime,location,tags:[...smSelTags],notes};fbSocRef.child(editSocId).set(updated);}
  } else {
    const newId=uid();
    const evt={id:newId,title,date,time,endTime,location,tags:[...smSelTags],notes};
    fbSocRef.child(newId).set(evt);
  }
  rebuild();closeSocModal();render();
}
function deleteSocial(){
  const e=socialEvents.find(x=>x.id===editSocId);
  if(e&&e.base){if(!personal.hiddenSoc.includes(editSocId))personal.hiddenSoc.push(editSocId);delete personal.editSoc[editSocId];persist();toast("Hidden on this device");}
  else{fbSocRef.child(editSocId).remove();}
  rebuild();closeSocModal();render();
}

// Click outside modal to close
document.getElementById("dueModal").addEventListener("click",e=>{if(e.target===document.getElementById("dueModal"))closeDueModal();});
document.getElementById("socModal").addEventListener("click",e=>{if(e.target===document.getElementById("socModal"))closeSocModal();});

loadData();
</script>
